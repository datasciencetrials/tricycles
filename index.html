    <style>
      /* Keep the long-form thesis inside the viewport while retaining
         horizontal scrolling on wide evidence tables and code extracts. */
      .thesis-light {
        box-sizing: border-box;
        overflow-x: clip;
      }
      .thesis-light-inner,
      .thesis-body-card,
      .thesis-content {
        min-width: 0;
        box-sizing: border-box;
      }
      .thesis-body-card {
        max-width: calc(100% - 324px);
      }
      .thesis-content {
        max-width: 100%;
        overflow-wrap: anywhere;
      }
      .thesis-content table,
      .thesis-content pre {
        display: block;
        max-width: 100%;
        box-sizing: border-box;
        overflow-x: auto;
      }
      @media (max-width: 900px) {
        .thesis-body-card {
          max-width: 100% !important;
        }
      }
    </style>
