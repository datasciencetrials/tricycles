name: Backup on Deploy
on: [workflow_dispatch]

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create backup branch snapshot
        run: |
          git config user.name "MoWT Backup Bot"
          git config user.email "backup@mowt.go.ug"
          BACKUP_BRANCH="backup/$(date +%Y-%m-%d-%H%M)"
          git checkout -b "$BACKUP_BRANCH"
          git push origin "$BACKUP_BRANCH"

